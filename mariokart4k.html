<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mario Kart Retour — Fan Ad</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:white;background:#080d21;overflow-x:hidden}.sky{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:35px 20px;background:radial-gradient(circle at 50% 30%,#394ed0 0%,#161e5a 44%,#070c1f 90%)}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff8 1px,transparent 2px);background-size:65px 65px;opacity:.35;animation:drift 12s linear infinite}@keyframes drift{to{background-position:260px 130px}}.content{position:relative;z-index:2;max-width:850px}.tag{display:inline-block;background:#ffce22;color:#151515;padding:9px 18px;border-radius:30px;font-weight:900;letter-spacing:2px;transform:rotate(-3deg)}h1{font-size:clamp(3rem,10vw,7rem);line-height:.95;margin:25px 0 15px;text-transform:uppercase;font-weight:1000;font-style:italic;text-shadow:5px 7px 0 #e12b3c,10px 12px 0 #101329}h1 span{color:#ffdd27}.subtitle{font-size:clamp(1.1rem,3vw,1.6rem);font-weight:700;text-shadow:0 2px 6px #000}.track{height:135px;position:relative;margin:35px auto 15px;max-width:700px;overflow:hidden;border-radius:60px;background:repeating-linear-gradient(90deg,#30333e 0 70px,#383c49 70px 140px);border:7px solid #e8edf9;box-shadow:0 15px 0 #101326}.track:after{content:"";position:absolute;top:50%;left:0;width:100%;border-top:6px dashed #ffe657;opacity:.9}.kart{position:absolute;top:15px;left:5%;font-size:75px;z-index:2;filter:drop-shadow(0 6px 3px #0008);animation:race 3.5s ease-in-out infinite alternate}@keyframes race{from{left:5%;transform:rotate(-6deg)}to{left:77%;transform:rotate(6deg)}}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:15px;margin:32px 0}.btn{cursor:pointer;border:0;border-radius:14px;padding:16px 26px;font-weight:900;font-size:1rem;box-shadow:0 6px 0 #0006;transition:transform .15s}.btn:hover{transform:translateY(-4px)}.primary{background:#ffdc27;color:#171723}.secondary{background:#ef3551;color:white}.features{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.features span{padding:10px 15px;background:#ffffff18;border:1px solid #ffffff38;border-radius:12px;font-weight:700}.notice{opacity:.72;font-size:.8rem;margin-top:35px}#countdown{font-size:1.3rem;min-height:1.5em;color:#ffeb72;font-weight:900}
</style></head><body><main class="sky"><div class="stars"></div><div class="content"><div class="tag">🏁 FAN-MADE PROMO 🏁</div><h1>MARIO KART<br><span>RETOUR</span></h1><p class="subtitle">THE RACE IS BACK. THE CHAOS NEVER LEFT.</p><div class="track"><div class="kart" id="kart">🏎️</div></div><div class="features"><span>⚡ FULL SPEED</span><span>🏆 EPIC RACES</span><span>🍌 WILD POWER-UPS</span></div><div class="buttons"><button class="btn primary" onclick="launch()">🏁 START YOUR ENGINES</button><button class="btn secondary" onclick="honk()">📣 HONK!</button></div><div id="countdown" aria-live="polite"></div><p class="notice">Unofficial fan-made advertisement concept. Not affiliated with or endorsed by Nintendo. No release date or game features are confirmed here.</p></div></main><script>

</script></body></html>
